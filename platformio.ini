; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:fcplc]
platform = espressif32@6.9.0
board = 4d_systems_esp32s3_gen4_r8n16
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions/custom_16MB_ota.csv
board_build.filesystem = littlefs
board_build.psram = enabled
build_unflags = -std=gnu++11 -std=c++11
build_flags = 
	-DBOARD_HAS_PSRAM
  	-DCONFIG_SPIRAM_USE_MALLOC=1
	-std=gnu++17
	-Wno-deprecated-declarations
	-mtext-section-literals
	-DLOGGER_LEVEL=4
	-DLOGGER_USE_COLOR=0
	-DCORE_DEBUG_LEVEL=0
	-DWEBSOCKETS_TCP_TIMEOUT=350
	-DBOARD_FCPLC_3V1
	-DFW_VERSION=\"1.0.0\"
	-DTASK_BINDER_RTOS_DEBUG=0
	-DTASK_BINDER_PLC_SCAN_TICK_MS=5
lib_deps = 
	bblanchon/ArduinoJson@7.4.2
	gyverlibs/FastBot2@1.2.5
	me-no-dev/ESPAsyncWebServer
	links2004/WebSockets@2.4.2
